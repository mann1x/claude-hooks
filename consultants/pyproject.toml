[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-hooks-consultants"
version = "0.1.0"
description = "LangGraph council engine for the claude-hooks /consultants skill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "claude-hooks contributors" }]

# Pinned to LangGraph 1.x stack (1.0 GA Oct 2025, 1.2 May 2026). The
# v2 council overhaul targets 1.2-specific features (TimeoutPolicy,
# RunControl, astream_events v3, DeltaChannel). langchain +
# langchain-community were declared but never imported by the engine
# — dropped 2026-05-16 along with the 1.2 bump.
dependencies = [
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint>=4.1,<5.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "langgraph-prebuilt>=1.1,<2.0",
    "langchain-core>=1.4,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "fastapi>=0.115,<0.140",
    "uvicorn[standard]>=0.32,<0.50",
    "httpx>=0.27,<0.30",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Opt-in Postgres checkpointer for production. Requires psycopg in
# the env. Default behavior (sqlite-file checkpointer) needs no extra
# install.
postgres = [
    "langgraph-checkpoint-postgres>=3.1,<4.0",
    "psycopg[binary,pool]>=3.2,<4.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
claude-consultants = "consultants.cli:main"
consultants-server = "consultants.server.__main__:main"

# The pyproject lives INSIDE the package directory (claude-hooks's
# main pyproject.toml occupies the repo root, so we can't put this
# one a level up). Map every package back to its on-disk path: the
# ``consultants`` top-level package is ``.`` (the dir holding this
# file), and the two subpackages live in ``engine`` / ``server``
# relative to it. Explicit packages list avoids find-packages
# misinterpreting ``engine`` / ``server`` as top-level modules.
[tool.setuptools]
packages = ["consultants", "consultants.engine", "consultants.server"]
package-dir = { "consultants" = ".", "consultants.engine" = "engine", "consultants.server" = "server" }
